<head>

    <meta charset="UTF-8">

    <meta name="description" content="Recursos e interações do GameZone">
    <meta name="keywords" content="GameZone, jogos, HTML">

    <title>GameZone - Avaliar Jogo</title>

</head>

<body>

    <header>

        <h1>🎮 GameZone</h1>

        <nav>
            <a href="Homepage.html">Início</a> |
            <a href="jogos.html">Jogos</a> |
            <a href="ranking.html">Ranking</a> |
            <a href="sobre.html">Sobre</a> |
            <a href="minecraft.html">Minecraft</a> |
            <a href="red_dead_redemption_2.html">Red Dead Redemption 2</a> |
            <a href="zelda.html">Zelda</a>|
            <a href="gta_v.html">GTA V</a>|
        </nav>

    </header><hr>

    <main>

        <section>

            <h2>🎮 Avalie um jogo</h2>

            <form>

                <fieldset>

                    <legend>Informações sobre o jogo</legend>

                    <div>
                        <label for="nome">Nome:</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome"
                            required>
                    </div><br>

                    <div>
                        <label for="jogo">Escolha um jogo:</label>
                        <input
                            list="jogos"
                            id="jogo"
                            name="jogo"
                            placeholder="Digite ou escolha um jogo"
                            required>

                        <datalist id="jogos">
                            <option value="Minecraft">
                            <option value="Red Dead Redemption 2">
                            <option value="The Legend of Zelda: Breath of the Wild">
                            <option value="Fortnite">
                            <option value="GTA V">
                        </datalist>
                    </div><br>

                    <div>
                        <label for="data">Data em que começou a jogar:</label>
                        <input
                            type="date"
                            id="data"
                            name="data"
                            required>
                    </div><br>

                    <div>
                        <label for="nota">Nota do jogo (0 a 10):</label>
                        <input
                            type="range"
                            id="nota"
                            name="nota"
                            min="0"
                            max="10"
                            value="5">
                    </div><br>

                    <div>
                        <label for="arquivo">Envie uma imagem:</label>
                        <input
                            type="file"
                            id="arquivo"
                            name="arquivo">
                    </div>

                </fieldset>

                <fieldset>

                    <legend>Plataforma</legend>

                    <div>
                        <input
                            type="radio"
                            id="pc"
                            name="plataforma"
                            value="PC">
                        <label for="pc">PC</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="playstation"
                            name="plataforma"
                            value="PlayStation">
                        <label for="playstation">PlayStation</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="xbox"
                            name="plataforma"
                            value="Xbox">
                        <label for="xbox">Xbox</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="nintendo"
                            name="plataforma"
                            value="Nintendo">
                        <label for="nintendo">Nintendo</label>
                    </div>

                </fieldset>

                <fieldset>

                    <legend>O que você gosta nos jogos?</legend>

                    <div>
                        <input
                            type="checkbox"
                            id="historia"
                            name="gosto"
                            value="historia">
                        <label for="historia">História</label>
                    </div>

                    <div>
                        <input
                            type="checkbox"
                            id="graficos"
                            name="gosto"
                            value="graficos">
                        <label for="graficos">Gráficos</label>
                    </div>

                    <div>
                        <input
                            type="checkbox"
                            id="multiplayer"
                            name="gosto"
                            value="multiplayer">
                        <label for="multiplayer">Multiplayer</label>
                    </div>

                    <div>
                        <input
                            type="checkbox"
                            id="exploracao"
                            name="gosto"
                            value="exploracao">
                        <label for="exploracao">Exploração</label>
                    </div>

                </fieldset>

                <fieldset>

                    <legend>Comentário</legend>

                    <div>
                        <label for="comentario">Escreva sua opinião:</label>
                        <textarea
                            id="comentario"
                            name="comentario"
                            rows="5"
                            cols="50"
                            placeholder="Digite aqui sua opinião sobre o jogo..."></textarea>
                    </div>

                </fieldset><br>

                <div>
                    <button type="submit">Enviar avaliação</button>
                    <button type="reset">Limpar</button>
                </div>

            </form>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 GameZone</p>

    </footer>

</body>

</html>
